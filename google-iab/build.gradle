plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'games.moisoni.google_iab'

    compileSdk = 37

    defaultConfig {
        minSdk = 23

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        aarMetadata {
            minCompileSdk = 23
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }

        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }

    lint {
        targetSdk = 37
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.moisoni97'
                artifactId = 'google-inapp-billing'
                version = '2.0.0'
            }
        }
    }
}

configurations.configureEach {
    withDependencies { dependencies ->
        dependencies.removeIf { it.group == 'org.jetbrains.kotlin' && it.name == 'kotlin-stdlib' }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    api 'com.android.billingclient:billing:9.1.0'
    api 'androidx.lifecycle:lifecycle-common:2.11.0'
    api 'androidx.annotation:annotation:1.11.0'
}